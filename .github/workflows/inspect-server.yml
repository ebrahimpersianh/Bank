name: بررسیِ فقط‌خواندنیِ سرور

# فقط SELECT - هیچ چیزی را عوض نمی‌کند. برای بررسیِ اشتراکِ مالک، خریدهای اخیر و کرش‌ها.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          OWNER_PHONE: ${{ secrets.OWNER_PHONE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: OWNER_PHONE
          script: |
            DB=~/VameMan/data.sqlite
            echo "=== crashes last 14 days by message+version ==="
            sqlite3 -header $DB "SELECT substr(message,1,90) m, app_version v, COUNT(*) n, MAX(created_at) last FROM crash_reports WHERE created_at >= datetime('now','-14 days') GROUP BY m, v ORDER BY n DESC LIMIT 30;"
            echo "=== one stack per message ==="
            sqlite3 $DB "SELECT '#### ' || app_version || ' | ' || substr(message,1,90) || char(10) || substr(stack,1,1500) || char(10) || coalesce(substr(context,1,200),'') FROM crash_reports WHERE id IN (SELECT MAX(id) FROM crash_reports WHERE created_at >= datetime('now','-14 days') GROUP BY substr(message,1,40));"
