name: بررسیِ فقط‌خواندنیِ سرور

# فقط SELECT - هیچ چیزی را عوض نمی‌کند. برای بررسیِ اشتراکِ مالک، خریدهای اخیر و کرش‌ها.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          OWNER_PHONE: ${{ secrets.OWNER_PHONE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: OWNER_PHONE
          script: |
            DB=~/VameMan/data.sqlite
            echo "=== bank notification/SMS events, last 4 days ==="
            sqlite3 -header $DB "SELECT day, name, count FROM usage_events WHERE day >= date('now','-4 days') AND (name LIKE '%notif%' OR name LIKE '%sms%') ORDER BY day DESC, name;"
