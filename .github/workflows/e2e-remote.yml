name: آزمایشِ راه‌دورِ جیبک روی شبیه‌ساز (دستی)

# Claude از لپ‌تاپ گوشیِ شبیه‌سازِ این رانر را می‌گرداند: فرمان در شاخه‌ی e2e-cmd، عکس در e2e-out.
# نسخه‌ی دیباگِ مایکت (همه‌چیز باز). داده‌ها ساختگی‌اند؛ هیچ ورودی با شماره‌ی واقعی انجام نمی‌شود.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "حداکثر مدتِ آزمایش (دقیقه)"
        default: "60"

jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: ساختِ نسخه‌ی دیباگِ مایکت
        working-directory: native-android
        run: ./gradlew :app:assembleMyketDebug -PjibakVersionCode=999 --console=plain
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: شبیه‌ساز + جلسه‌ی راه‌دور
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_MINUTES: ${{ inputs.minutes }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 4096
          script: bash native-android/tools/e2e/remote.sh
