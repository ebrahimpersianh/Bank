name: تستِ اینسترومنتد + اسموک‌تستِ اپ (با امولاتورِ واقعی)

# جداگانه از build-native-android.yml چون این‌یکی به یه امولاتورِ اندرویدِ واقعی نیاز داره (کندتر،
# ~۱۰-۱۵ دقیقه‌ی اضافه فقط برای بالا آمدنِ امولاتور) - رجوع کن به CLAUDE.md برای دلیلِ کامل (دیتابیس
# با SQLCipher رمزنگاری شده، تستِ سبکِ JVM/Paparazzi نمی‌تونه این کتابخونه‌ی نیتیو رو باز کنه). علاوه
# بر تستِ migration، این ورک‌فلو خودِ اپ (نسخه‌ی cafebazaarDebug) رو هم رو همین امولاتور نصب/باز
# می‌کنه و چک می‌کنه بلافاصله کرش نکنه - یه اسموک‌تستِ ساده ولی واقعی، رو یه دستگاهِ اندرویدِ واقعی.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "native-android/data/**"
      - ".github/workflows/instrumented-tests.yml"

jobs:
  instrumented-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        api-level: [29]
    defaults:
      run:
        working-directory: native-android
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: آماده‌سازی Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: کش Gradle
        uses: gradle/actions/setup-gradle@v4

      # KVM لازم داره تا امولاتور واقعاً سریع/شتاب‌دهی‌شده اجرا بشه رو رانرِ گیت‌هاب (وگرنه یا اصلاً
      # بالا نمیاد یا خیلی کند می‌شه).
      - name: فعال‌سازیِ KVM برای شتاب‌دهیِ امولاتور
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: اجرای تستِ اینسترومنتد + نصب/بازکردنِ اپ رو امولاتور (بررسیِ کرش‌نکردن)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          working-directory: native-android
          # پروفایلِ pixel_5 پیش‌فرض ~۷.۴ گیگابایت فضا برای پارتیشنِ userdata می‌خواد، ولی رانرِ
          # گیت‌هاب بعدِ نصبِ SDK/سیستم‌ایمیج فقط ~۶.۴ گیگ آزاد داره - رانِ اول دقیقاً با همین ارور
          # ("Not enough space to create userdata partition") فیل شد. این عددِ کوچیک‌تر (۴ گیگ)
          # برای یه تستِ سبکِ دیتابیس کاملاً کافیه.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 4096
          # مرحله‌ی اول: تستِ اینسترومنتدِ migration (ماژولِ data، همونی که از قبل بود).
          # مرحله‌ی دوم (جدید): نسخه‌ی دیباگِ خودِ اپ (فلیورِ cafebazaar) رو رو همین امولاتور نصب و
          # باز می‌کنیم، ۱۰ ثانیه صبر می‌کنیم، و چک می‌کنیم پروسه‌ش هنوز زنده‌ست - اگه اپ بلافاصله
          # بعدِ باز شدن کرش کنه (دقیقاً همون کلاسِ باگی که نسخه‌ی ۱.۰.۳۱۵ رو کرش می‌کرد)، این مرحله
          # با شکست تمام می‌شه و لاگِ کرش هم چاپ می‌شه.
          script: |
            ./gradlew :data:connectedDebugAndroidTest --console=plain
            ./gradlew :app:installCafebazaarDebug --console=plain
            adb shell am start -n ir.sadteam.loancalc/.MainActivity
            sleep 10
            if adb shell pidof ir.sadteam.loancalc > /dev/null 2>&1; then
              echo "OK: اپ بعد از ۱۰ ثانیه هنوز روشنه - کرش نکرده."
            else
              echo "FAIL: اپ کرش کرد یا اصلاً بالا نیومد - این ۳۰۰ خطِ آخرِ logcat:"
              adb logcat -d -t 300
              exit 1
            fi

      # اگه exportSchema (اولین‌بار امروز روشن شد) اسکیمای جدیدی تو data/schemas/ ساخته، خودکار
      # کامیتش کن - هم‌الگو با record-paparazzi-snapshots.yml.
      - name: کامیتِ خودکارِ اسکیمای جدیدِ Room (اگه تغییر کرده)
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -n "$(git status --porcelain native-android/data/schemas)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add native-android/data/schemas
            git commit -m "بروزرسانیِ خودکارِ اسکیمای Room (data/schemas/)"
            git push
          else
            echo "اسکیمایی تغییر نکرده."
          fi
