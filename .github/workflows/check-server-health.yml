name: چکِ سلامتِ سرور (VPS)

# اجرای دستی - وضعیتِ سرویسِ pm2، فضای دیسک، و جوابِ واقعیِ API رو چک می‌کنه و تو لاگِ همین ران
# چاپ می‌کنه (بدونِ نیازِ SSH دستی از طرفِ کاربر/من).
on:
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: چکِ وجودِ سکرت‌های VPS
        id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_USER }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::سکرت‌های VPS ست نشدن."
            exit 1
          fi

      - name: وضعیتِ سرویس + دیسک + جوابِ واقعیِ API
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== pm2 status ==="
            pm2 describe loan-calc-api | grep -E "status|uptime|restarts" || pm2 list
            echo ""
            echo "=== فضای دیسک ==="
            df -h / | tail -1
            echo ""
            echo "=== حجمِ دیتابیس ==="
            ls -lh ~/VameMan/data.sqlite 2>/dev/null || echo "پیدا نشد"
            echo ""
            echo "=== جوابِ محلیِ API (پورت 3000) ==="
            curl -s -o /dev/null -w "HTTP status: %{http_code}\n" --max-time 5 http://localhost:3000/api/app-version || echo "جواب نداد"
            echo ""
            echo "=== ۱۰ خطِ آخرِ لاگ ==="
            pm2 logs loan-calc-api --lines 10 --nostream
            echo ""
            echo "=== ۵ گزارشِ کرشِ آخر ==="
            sqlite3 ~/VameMan/data.sqlite "SELECT id, created_at, app_version, message, stack FROM crash_reports ORDER BY id DESC LIMIT 3;" 2>&1 || echo "sqlite3 نصب نیست یا جدول پیدا نشد"
            echo ""
            echo "=== وضعیتِ اشتراکِ حساب‌های تست/دائمی (چک کن آیا حسابِ تست بازارها دائمی‌مشترک مونده) ==="
            sqlite3 ~/VameMan/data.sqlite "SELECT phone, subscribed, subscribed_until, subscription_tier, created_at FROM users WHERE phone IN ('09121111111','09366963867');" 2>&1 || echo "کوئری شکست خورد"
            echo ""
            echo "=== [یک‌بارمصرف] برداشتنِ کاملِ فلگِ اشتراک از حسابِ تستِ ۰۹۱۲۱۱۱۱۱۱۱ (برگشت به حالتِ آزمایشیِ خودکار) ==="
            sqlite3 ~/VameMan/data.sqlite "UPDATE users SET subscribed = 0, subscribed_until = NULL, subscription_tier = NULL WHERE phone = '09121111111';"
            sqlite3 ~/VameMan/data.sqlite "SELECT phone, subscribed, subscribed_until, subscription_tier, created_at FROM users WHERE phone = '09121111111';"
