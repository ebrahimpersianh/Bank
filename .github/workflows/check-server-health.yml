name: چکِ سلامتِ سرور (VPS)

# اجرای دستی - وضعیتِ سرویسِ pm2، فضای دیسک، و جوابِ واقعیِ API رو چک می‌کنه و تو لاگِ همین ران
# چاپ می‌کنه (بدونِ نیازِ SSH دستی از طرفِ کاربر/من).
on:
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: چکِ وجودِ سکرت‌های VPS
        id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_USER }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::سکرت‌های VPS ست نشدن."
            exit 1
          fi

      - name: وضعیتِ سرویس + دیسک + جوابِ واقعیِ API
        env:
          OWNER_PHONE: ${{ secrets.OWNER_PHONE }}
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # شماره‌ی شخصیِ مالک از سکرت می‌آید، نه هاردکد در فایل. اگر سکرت ست نشده باشد
          # فقط ردیفِ حسابِ تست برمی‌گردد و کوئری نمی‌شکند.
          envs: OWNER_PHONE
          script: |
            echo "=== pm2 status ==="
            pm2 describe loan-calc-api | grep -E "status|uptime|restarts" || pm2 list
            echo ""
            echo "=== فضای دیسک ==="
            df -h / | tail -1
            echo ""
            echo "=== حجمِ دیتابیس ==="
            ls -lh ~/VameMan/data.sqlite 2>/dev/null || echo "پیدا نشد"
            echo ""
            echo "=== جوابِ محلیِ API (پورت 3000) ==="
            curl -s -o /dev/null -w "HTTP status: %{http_code}\n" --max-time 5 http://localhost:3000/api/app-version || echo "جواب نداد"
            echo ""
            echo "=== وضعیتِ اشتراکِ حساب‌های تست/دائمی ==="
            sqlite3 ~/VameMan/data.sqlite "SELECT substr(phone,1,4) || '***' || substr(phone,-2), subscribed, subscribed_until, subscription_tier, created_at FROM users WHERE phone IN ('09121111111', '$OWNER_PHONE');" 2>&1 || echo "کوئری شکست خورد"
            echo ""
            echo "=== ۱۰ خطِ آخرِ لاگ ==="
            pm2 logs loan-calc-api --lines 10 --nostream
            echo ""
            # ⚠️ استکِ کرش عمداً به ۱۵۰ کاراکتر بریده می‌شه: استکِ کاملِ Compose صدها خطه و
            # کلِ خروجیِ این ورک‌فلو رو می‌بلعید (بخشِ قیمت‌ها دیگه با tail خونده نمی‌شد).
            echo "=== ۳ گزارشِ کرشِ آخر (استکِ بریده) ==="
            sqlite3 ~/VameMan/data.sqlite "SELECT id, created_at, app_version, user_id, message, substr(replace(stack, char(10), ' '), 1, 150) FROM crash_reports ORDER BY id DESC LIMIT 3;" 2>&1 || echo "sqlite3 نصب نیست یا جدول پیدا نشد"
            echo ""
            # 🔻 قیمت‌ها عمداً **آخرین** بخشه تا همیشه ته لاگ باشه و با tail خونده بشه.
            echo "=== قیمت‌ها: آیا کلید ست شده؟ ==="
            grep -q '^PRICE_API_KEY=' ~/VameMan/.env && echo "PRICE_API_KEY هست" || echo "PRICE_API_KEY تو .env نیست"
            # ⚠️ خودِ کلید هیچ‌وقت چاپ نمی‌شه - فقط طول و هش، تا خرابیِ نامرئیِ کپی/پیست
            # (نیم‌فاصله/فاصله/newlineِ اضافه که تو کیبوردِ فارسی رایجه) رو بدونِ لو دادنِ
            # کلید تشخیص بدیم. مقدارِ بعدِ = تا آخرِ خط، بدونِ trimِ اضافه از ما.
            PKRAW=$(grep '^PRICE_API_KEY=' ~/VameMan/.env | cut -d= -f2-)
            echo "طولِ کلید (بایت): ${#PKRAW}"
            echo "هشِ کلید (فقط برای تطبیقِ دوباره، خودِ کلید نه): $(printf '%s' "$PKRAW" | sha256sum | cut -c1-16)"
            echo ""
            echo "=== قیمت‌ها: جوابِ خودمون (/api/prices) ==="
            curl -s --max-time 20 http://localhost:3000/api/prices | head -c 2500
            echo ""
