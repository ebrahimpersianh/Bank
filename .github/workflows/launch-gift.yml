name: هدیه‌ی انتشارِ جیبک (همه‌ی کاربرانِ قدیمی)

# اجرای دستی، روزِ انتشارِ جیبک در استور. به هر کاربرِ قدیمی N روز اشتراک (اشتراکِ فعال از
# تاریخِ انقضایش جلو می‌رود) + یک پیامِ تشکرِ جدا: خریداران یک متن، بقیه متنِ دیگر.
# هر نفر فقط یک بار می‌گیرد. اول با dry_run=true اجرا کن تا فقط تعداد را ببینی.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "فقط شمارش (بی هیچ تغییری)"
        type: boolean
        default: true
      days:
        description: "چند روز"
        required: true
        default: "30"

jobs:
  gift:
    runs-on: ubuntu-latest
    steps:
      - name: ساختِ درخواست
        id: payload
        env:
          DAYS: ${{ inputs.days }}
          DRY: ${{ inputs.dry_run }}
        run: |
          PAID_T="💚 ممنون که از اول همراهمون بودی"
          PAID_M="تو جزوِ اولین کسایی بودی که با خریدِ اشتراک از ما حمایت کردی. به پاسِ این همراهی، ${DAYS} روز اشتراکِ هدیه به اشتراکت اضافه شد. جیبک حالا خیلی بیشتر از یه محاسبه‌گرِ وامه - امیدواریم دوستش داشته باشی."
          OLD_T="🎁 به جیبک خوش اومدی"
          OLD_M="«وام من» حالا شده «جیبک»: حسابداریِ کامل، بودجه، گزارش، دارایی و چک، کنارِ همون وام‌هایی که داشتی. به پاسِ اینکه از قبل با ما بودی، ${DAYS} روز اشتراکِ کامل هدیه گرفتی تا همه‌چیز رو امتحان کنی."
          echo "json=$(jq -cn --argjson d "$DAYS" --argjson dry "$DRY" --arg pt "$PAID_T" --arg pm "$PAID_M" --arg ot "$OLD_T" --arg om "$OLD_M" \
            '{days:$d,dryRun:$dry,paidTitle:$pt,paidMessage:$pm,oldTitle:$ot,oldMessage:$om}')" >> "$GITHUB_OUTPUT"

      - name: فرستادن از طریقِ خودِ سرور
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: PAYLOAD
          script: |
            set -e
            cd ~/VameMan
            TOKEN=$(grep '^ADMIN_TOKEN=' .env | cut -d= -f2-)
            curl -sS -X POST "http://localhost:3000/api/announcements/launch-gift" \
              -H "Content-Type: application/json" \
              -H "X-Admin-Token: $TOKEN" \
              -d "$PAYLOAD"
            echo ""
        env:
          PAYLOAD: ${{ steps.payload.outputs.json }}
