name: گشتِ خودکارِ Firebase Test Lab (کرش‌یابی)

# ۲۴ آبان (خواسته‌ی کاربر): بعد از هر بیلدِ اندروید، APK روی Firebase Test Lab با «Robo test»
# خودکار گشته می‌شود تا کرش‌ها پیدا شوند - حتماً روی یک اندروید ۷ (API 24/25) و یک گوشیِ تازه.
# فقط سهمیه‌ی رایگانِ Spark (روزی ۱۰ مجازی + ۵ واقعی): هر اجرا فقط ۲ دستگاه، ترجیحاً مجازی.
# نیاز: سکرتِ FIREBASE_SERVICE_ACCOUNT (کلیدِ JSONِ یک Service Account در پروژه‌ی jibak-test).
# 🔒 مخزن عمومی است: هیچ کلید یا محتوای سکرتی در لاگ چاپ نمی‌شود.

on:
  # خودکار بعد از بیلدِ موفقِ اندروید (APKِ ریلیزِ مایکتِ همان بیلد).
  workflow_run:
    workflows: ["Build Native Kotlin App (اجرای دستی)"]
    types: [completed]
  # دستی.
  workflow_dispatch:
    inputs:
      apk:
        description: "کدام APK؟ latest-release = آخرین نسخه‌ی منتشرشده در Releases (بی بیلد) · debug = ساختِ نسخه‌ی دیباگِ مایکت"
        type: choice
        options: [latest-release, debug]
        default: latest-release
      timeout:
        description: "مدتِ گشت روی هر دستگاه (مثلاً 5m)"
        default: "5m"

permissions:
  contents: read
  actions: read

concurrency:
  group: firebase-robo
  cancel-in-progress: false

env:
  PROJECT_ID: jibak-test

jobs:
  robo:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: سکرت هست؟
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::سکرتِ FIREBASE_SERVICE_ACCOUNT تنظیم نشده - راهنما در design/2026-11-14/FIREBASE-SETUP.md"
            exit 1
          fi

      # ── APK ────────────────────────────────────────────────────────────────
      - name: APKِ همان بیلد (خودکار)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: loan-calculator-native-myket-release-apk
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk

      - name: APKِ آخرین نسخه‌ی منتشرشده
        if: github.event_name == 'workflow_dispatch' && inputs.apk == 'latest-release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apk
          gh release download --repo "${{ github.repository }}" --pattern '*-myket.apk' --dir apk
          ls -la apk

      - uses: actions/setup-java@v4
        if: github.event_name == 'workflow_dispatch' && inputs.apk == 'debug'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name == 'workflow_dispatch' && inputs.apk == 'debug'
      - name: ساختِ نسخه‌ی دیباگِ مایکت
        if: github.event_name == 'workflow_dispatch' && inputs.apk == 'debug'
        working-directory: native-android
        run: |
          ./gradlew :app:assembleMyketDebug -PjibakVersionCode=999 --console=plain
          mkdir -p ../apk && cp app/build/outputs/apk/myket/debug/app-myket-debug.apk ../apk/

      - name: پیدا کردنِ فایل
        id: apk
        run: |
          f=$(ls apk/*.apk | head -1)
          [ -n "$f" ] || { echo "::error::APK پیدا نشد"; exit 1; }
          echo "path=$f" >> "$GITHUB_OUTPUT"
          echo "APK: $f ($(du -h "$f" | cut -f1))"

      # ── گوگل ───────────────────────────────────────────────────────────────
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      # کاتالوگِ دستگاه‌ها هر بار عوض می‌شود؛ به‌جای اسمِ ثابت، از روی فهرستِ همان لحظه انتخاب می‌کنیم.
      - name: انتخابِ دستگاه‌ها (اندروید ۷ + یک گوشیِ تازه)
        id: dev
        run: |
          gcloud firebase test android models list --project "$PROJECT_ID" --format=json > models.json
          python3 - <<'PY'
          import json, os
          models = json.load(open("models.json"))
          def deprecated(m, v):
              return any(t == f"deprecated={v}" for t in m.get("tags", []))
          def pick(versions, prefer_virtual=True):
              best = None
              for m in models:
                  form = m.get("form", "")
                  for v in m.get("supportedVersionIds", []):
                      if v not in versions:
                          continue
                      score = (
                          0 if (form == "VIRTUAL") == prefer_virtual else 1,
                          1 if deprecated(m, v) else 0,
                          -int(v),
                      )
                      if best is None or score < best[0]:
                          best = (score, m["id"], v, form)
              return best
          old = pick({"24", "25"})
          new = pick({"34"}) or pick({"33", "32", "31"})
          devices, notes = [], []
          if old:
              devices.append(f"model={old[1]},version={old[2]}")
              notes.append(f"اندروید ۷: {old[1]} (API {old[2]}, {old[3]})")
          else:
              notes.append("⚠️ در کاتالوگِ Test Lab هیچ دستگاهِ اندروید ۷ (API 24/25) نیست.")
          if new:
              devices.append(f"model={new[1]},version={new[2]}")
              notes.append(f"گوشیِ تازه: {new[1]} (API {new[2]}, {new[3]})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("args=" + " ".join(f"--device {d}" for d in devices) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### دستگاه‌ها\n" + "\n".join(f"- {n}" for n in notes) + "\n\n")
          print("\n".join(notes))
          PY

      - name: گشتِ خودکار (Robo)
        id: run
        continue-on-error: true
        run: |
          set -o pipefail
          gcloud firebase test android run \
            --project "$PROJECT_ID" \
            --type robo \
            --app "${{ steps.apk.outputs.path }}" \
            ${{ steps.dev.outputs.args }} \
            --timeout "${{ inputs.timeout || '5m' }}" \
            --results-history-name "jibak" \
            --results-dir "run-${{ github.run_id }}" \
            --client-details matrixLabel="jibak-${{ github.run_id }}" \
            2>&1 | tee robo.log

      - name: خلاصه‌ی نتیجه
        if: always()
        run: |
          {
            echo "### نتیجه‌ی گشتِ خودکار"
            link=$(grep -o 'https://console.firebase.google.com/[^] ]*' robo.log | head -1)
            [ -n "$link" ] && echo "🔗 فیلم، عکس و کرش‌ها: $link" && echo
            echo '```'
            sed -n '/OUTCOME/,$p' robo.log | head -20
            echo '```'
            if grep -qiE 'crash|Failed' robo.log; then echo "❗ کرش یا خطا دیده شد - لینکِ بالا را باز کن."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "outcome=${{ steps.run.outcome }}"

      # روی Spark ممکن است سطلِ نتایج مالِ گوگل باشد و دانلود نشود؛ پس بی‌خطر رد می‌شود.
      - name: دانلودِ نتایج (اگر شد)
        if: always()
        continue-on-error: true
        run: |
          bucket=$(grep -o 'storage/browser/[^/]*' robo.log | head -1 | sed 's#storage/browser/##')
          [ -n "$bucket" ] || { echo "سطلِ نتایج پیدا نشد"; exit 0; }
          mkdir -p results
          gcloud storage cp -r "gs://$bucket/run-${{ github.run_id }}" results/ \
            --project "$PROJECT_ID" 2>/dev/null || echo "دانلود ممکن نشد؛ از لینکِ Firebase ببین."
          # فقط چیزهای سبک: عکس‌ها، لاگ، گزارشِ کرش. فیلم‌ها سنگین‌اند و در لینکِ Firebase هست.
          find results -name '*.mp4' -delete 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firebase-robo-results
          path: |
            results/
            robo.log
          retention-days: 7
          if-no-files-found: ignore

      - name: اگر گشت شکست خورد
        if: steps.run.outcome == 'failure'
        run: |
          echo "::warning::گشتِ خودکار کرش یا خطا پیدا کرد (یا اجرا نشد) - خلاصه و لینکِ Firebase را ببین."
          exit 1
