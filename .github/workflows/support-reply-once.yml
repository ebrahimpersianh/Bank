name: جوابِ پشتیبانی (یک‌بار، ۱۴ مهر)

on:
  workflow_dispatch:

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            DB=~/VameMan/data.sqlite
            send() {
              T="$1"; B="$2"
              sqlite3 $DB "INSERT INTO announcements (title, body, kind, target_user_id) SELECT '💬 جوابِ پشتیبانی ($T)', '$B', 'info', user_id FROM bug_reports WHERE ticket = '$T' AND status = 'open'; SELECT '$T sent: ' || changes(); UPDATE bug_reports SET status = 'answered' WHERE ticket = '$T';"
            }
            send 'JB-QXC8YK' "$(printf '%s\n' 'سلام، ممنون از پیامت 🌱' 'جیبک دفترِ حساب‌وکتابِ شخصی است و به حسابِ بانکیت وصل نیست، پس پولی از حسابت جابه‌جا نمی‌کند؛ فقط برداشت‌هایی که خودت انجام دادی را یادداشت می‌کند.' 'برای ثبتِ یک برداشت: در صفحه‌ی خانه دکمه‌ی «+» پایینِ صفحه را بزن ← «خرج» را انتخاب کن ← مبلغ، حساب و دسته را وارد کن ← ذخیره.' 'اگر بخواهی برداشت‌های کارتت خودکار ثبت شوند: تنظیمات ← «پیامک‌های بانکی» را روشن کن.')"
            send 'JB-CQCY2J' "$(printf '%s\n' 'سلام، نگران نباش 🌱' 'حسابِ جیبک فقط با کدی باز می‌شود که به شماره‌ی موبایلِ خودت پیامک می‌شود؛ پس تا وقتی این کد را به کسی ندهی، هیچ‌کسِ دیگری نمی‌تواند وارد حسابت شود. اطلاعاتت هم رمزنگاری‌شده روی گوشیِ خودت است.' 'برای اطمینانِ بیشتر: تنظیمات ← «قفلِ برنامه» را روشن کن تا با رمز یا اثرِ انگشت باز شود.' 'هیچ‌وقت کدِ ورود را برای کسی نفرست - پشتیبانیِ جیبک هم هرگز آن را از تو نمی‌خواهد.')"
