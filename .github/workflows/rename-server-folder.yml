name: تغییرِ نامِ پوشه‌ی سرور به VameMan (یه‌بارمصرف)

# اجرای دستی، فقط یه‌بار لازمه اجرا بشه - پوشه‌ی ~/loan-server رو (که همه‌چیزِ سرور، شاملِ jar/.env/
# دیتابیسِ واقعی توشه) رو خودِ VPS به ~/VameMan تغییرِ نام می‌ده، قبلش یه بکاپِ کاملِ پوشه هم می‌گیره
# (~/loan-server-backup-<تاریخ>) که اگه چیزی خراب شد، بشه فوری برگردوند. بعدش pm2 رو با مسیرِ جدید
# دوباره راه‌اندازی می‌کنه. بعدِ اجرای موفقِ این ورک‌فلو، بقیه‌ی ورک‌فلوها (build-server.yml،
# set-melipayamak-env.yml، check-server-health.yml) هم به ~/VameMan آپدیت شدن - این فایل بعدِ یه‌بار
# اجراشدن دیگه لازم نیست، می‌تونه حذف بشه.
on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: چکِ وجودِ سکرت‌های VPS
        id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_USER }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::سکرت‌های VPS ست نشدن."
            exit 1
          fi

      - name: بکاپ + تغییرِ نامِ پوشه + راه‌اندازیِ دوباره‌ی pm2 با مسیرِ جدید
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~
            if [ -d "VameMan" ]; then
              echo "پوشه‌ی VameMan از قبل وجود داره - این ورک‌فلو احتمالاً قبلاً اجرا شده، کاری انجام نمی‌دم."
              exit 0
            fi
            if [ ! -d "loan-server" ]; then
              echo "::error::پوشه‌ی loan-server پیدا نشد."
              exit 1
            fi
            BACKUP="loan-server-backup-$(date +%Y%m%d-%H%M%S)"
            cp -r loan-server "$BACKUP"
            echo "بکاپِ کامل گرفته شد: $BACKUP"
            SIZE_BEFORE=$(stat -c%s loan-server/data.sqlite 2>/dev/null || echo "0")
            pm2 delete loan-calc-api || true
            mv loan-server VameMan
            SIZE_AFTER=$(stat -c%s VameMan/data.sqlite 2>/dev/null || echo "0")
            if [ "$SIZE_BEFORE" != "$SIZE_AFTER" ]; then
              echo "::error::حجمِ دیتابیس بعدِ جابه‌جایی فرق کرد ($SIZE_BEFORE != $SIZE_AFTER) - چیزی درست نیست."
              exit 1
            fi
            cd ~/VameMan
            pm2 start java --name loan-calc-api --interpreter none --cwd ~/VameMan -- -jar loan-calculator-server-1.0.0-all.jar
            pm2 save
            sleep 3
            pm2 describe loan-calc-api | grep -q "online" && echo "OK: سرور با پوشه‌ی جدیدِ VameMan بالاست" || (echo "::error::سرور بالا نیومد - برگردوندن دستی از رو بکاپ لازمه."; exit 1)
            curl -s -o /dev/null -w "HTTP status: %{http_code}\n" --max-time 5 http://localhost:3000/api/app-version
