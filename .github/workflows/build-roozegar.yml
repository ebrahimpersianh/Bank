name: Build Roozegar (تقویم فارسی)

on:
  push:
    branches: [main, master, "claude/**"]
    paths:
      - "roozegar-android/**"
      - ".github/workflows/build-roozegar.yml"
  pull_request:
    paths:
      - "roozegar-android/**"
      - ".github/workflows/build-roozegar.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.ROOZEGAR_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: roozegar-android
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: آماده‌سازی Java (لازم برای Gradle/AGP)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: کش Gradle
        uses: gradle/actions/setup-gradle@v4

      # کلید release مخصوص روزگار (سکرت‌های جدا از «وام من»: ROOZEGAR_KEYSTORE_BASE64 و ...) - تا
      # وقتی ست نشدن، بیلد release با کلید دیباگ عمومی امضا می‌شه و فقط برای تست/نصب شخصیه، نه
      # آپلود به استور.
      - name: آماده‌سازی کلید واقعی release (اگه سکرت‌هاش ست شده باشن)
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        env:
          ROOZEGAR_KEYSTORE_BASE64: ${{ secrets.ROOZEGAR_KEYSTORE_BASE64 }}
        run: |
          echo "$ROOZEGAR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/roozegar-release.keystore"
          echo "ROOZEGAR_KEYSTORE_PATH=$RUNNER_TEMP/roozegar-release.keystore" >> "$GITHUB_ENV"

      - name: تنظیم versionCode/versionName یکتا و صعودی از شماره‌ی ران
        run: |
          sed -i "s/versionCode = 1/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i "s/versionName = \"1.0\"/versionName = \"1.0.${{ github.run_number }}\"/" app/build.gradle.kts

      - name: تست موتور تقویم جلالی (core - بدون وابستگی به اندروید)
        run: ./gradlew :core:test --console=plain

      - name: ساخت APKهای دیباگ (هر دو فلیور)
        run: ./gradlew :app:assembleDebug --console=plain

      - name: ساخت APKهای ریلیز (هر دو فلیور - روان، برای نصب این‌ها رو بردار)
        env:
          ROOZEGAR_KEYSTORE_PASSWORD: ${{ secrets.ROOZEGAR_KEYSTORE_PASSWORD }}
          ROOZEGAR_KEY_ALIAS: ${{ secrets.ROOZEGAR_KEY_ALIAS }}
          ROOZEGAR_KEY_PASSWORD: ${{ secrets.ROOZEGAR_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: بارگذاری APK ریلیز کافه‌بازار (این رو نصب کن)
        uses: actions/upload-artifact@v4
        with:
          name: roozegar-cafebazaar-release-apk
          path: roozegar-android/app/build/outputs/apk/cafebazaar/release/app-cafebazaar-release.apk

      - name: بارگذاری APK دیباگ کافه‌بازار
        uses: actions/upload-artifact@v4
        with:
          name: roozegar-cafebazaar-debug-apk
          path: roozegar-android/app/build/outputs/apk/cafebazaar/debug/app-cafebazaar-debug.apk

      - name: بارگذاری APK ریلیز مایکت
        uses: actions/upload-artifact@v4
        with:
          name: roozegar-myket-release-apk
          path: roozegar-android/app/build/outputs/apk/myket/release/app-myket-release.apk

      - name: بارگذاری APK دیباگ مایکت
        uses: actions/upload-artifact@v4
        with:
          name: roozegar-myket-debug-apk
          path: roozegar-android/app/build/outputs/apk/myket/debug/app-myket-debug.apk
