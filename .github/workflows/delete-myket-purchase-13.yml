name: حذفِ آخرین خریدِ مایکت (یک‌بار)

# تأییدِ کاربر ۲۰ مهر: «آخرین خریدِ مایکت رو حذف کن، یک ماهه بود» = ردیفِ ۱۳ (کاربر ۲۹، یک‌ماهه، ۱۷ مهر).
# فقط همین ردیف، با کپیِ پشتیبان. اشتراکِ خودِ کاربر (users.subscribed_until) دست نمی‌خورد.
on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            DB=~/VameMan/data.sqlite
            cp $DB ~/VameMan/data.sqlite.before-myket13-delete
            echo "=== قبل ==="
            sqlite3 -header $DB "SELECT id, user_id, product_id, store, price_toman, created_at FROM subscription_purchases WHERE id = 13;"
            sqlite3 $DB "DELETE FROM subscription_purchases WHERE id = 13 AND user_id = 29 AND store = 'myket' AND product_id = 'unlimited_loans_1m'; SELECT 'deleted: ' || changes();"
            echo "=== بعد (۳ خریدِ آخرِ مایکت) ==="
            sqlite3 -header $DB "SELECT id, user_id, product_id, created_at FROM subscription_purchases WHERE store = 'myket' ORDER BY id DESC LIMIT 3;"
