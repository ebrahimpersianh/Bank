name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: آماده‌سازی Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: آماده‌سازی Java (لازم برای ساخت اندروید)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: نصب پکیج‌های پروژه
        run: npm install

      - name: اضافه‌کردن پلتفرم اندروید
        run: npx cap add android

      - name: مجوز ویبره (برای Haptic Feedback)
        run: sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: ساخت آیکون و اسپلش اپ از تصویر resources/icon.png
        run: npx capacitor-assets generate --android

      - name: همگام‌سازی فایل‌های وب با پروژه اندروید
        run: npx cap sync android

      - name: پایین‌آوردن حداقل نسخه اندروید به ۵.۱ (API 22 - حداقل واقعی که کتابخونه‌های داخلی پشتیبانی می‌کنن)
        run: sed -i 's/minSdkVersion = .*/minSdkVersion = 22/' android/variables.gradle

      - name: تنظیم شماره نسخه (هر بیلد یه versionCode جدید و منحصربه‌فرد می‌گیره، وگرنه بازار آپلود نسخه‌ی بعدی رو رد می‌کنه)
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: مجوز اجرا به gradlew
        run: chmod +x android/gradlew

      - name: نصب کلید امضای ثابت دیباگ (تا هر بیلد رو نسخه قبلی نصب بشه، نه اینکه Android بگه "conflicts with an existing package")
        run: |
          mkdir -p ~/.android
          cp ci-debug.keystore ~/.android/debug.keystore

      - name: ساخت فایل APK (پشتیبانی خودکار از همه معماری‌های CPU)
        run: cd android && ./gradlew assembleDebug

      - name: بارگذاری APK به‌عنوان خروجی قابل دانلود
        uses: actions/upload-artifact@v4
        with:
          name: loan-calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: رمزگشایی کیستور امضای release از سکرت گیت‌هاب (فقط وقتی سکرت‌ها ست شده باشن)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: اضافه‌کردن signingConfig امضای release به build.gradle (فقط وقتی سکرت‌ها ست شده باشن)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          sed -i '/^android {/a\
              signingConfigs {\
                  release {\
                      storeFile file("release.keystore")\
                      storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")\
                      keyAlias System.getenv("RELEASE_KEY_ALIAS")\
                      keyPassword System.getenv("RELEASE_KEY_PASSWORD")\
                  }\
              }' android/app/build.gradle
          sed -i 's/minifyEnabled false/minifyEnabled false\n            signingConfig signingConfigs.release/' android/app/build.gradle

      - name: ساخت فایل APK امضاشده‌ی release برای آپلود به کافه‌بازار (فقط وقتی سکرت‌ها ست شده باشن)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease

      - name: بارگذاری APK امضاشده‌ی release به‌عنوان خروجی قابل دانلود (فقط وقتی سکرت‌ها ست شده باشن)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: loan-calculator-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk