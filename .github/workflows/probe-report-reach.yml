name: آیا آدرسِ گزارش از خارج در دسترس است؟

# یک‌باره و فقط‌خواندنی: از رانرِ گیت‌هاب (خارج از ایران) آدرسِ گزارش را صدا می‌زند تا بفهمیم
# آیا سرورِ آروان از خارج جواب می‌دهد یا نه. کد از سکرتِ REPORT_KEY ساخته می‌شود و هیچ‌جا چاپ نمی‌شود؛
# فقط کدِ وضعیتِ HTTP و چند بایتِ اولِ جواب (بی کلید) چاپ می‌شود.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: صدا زدنِ آدرس از خارج
        env:
          KEY: ${{ secrets.REPORT_KEY }}
        run: |
          HOST="https://server-8a887fd3-2459-4e6d-ace8-884dc36ca3db.ir-thr-fr1.arvancompute.ir"
          if [ -z "$KEY" ]; then echo "REPORT_KEY secret ست نشده"; exit 1; fi
          echo "=== گزارش (base) ==="
          CODE=$(curl -s -o body.json -w "%{http_code}" --max-time 25 "$HOST/api/report/$KEY" || echo "000")
          echo "HTTP: $CODE"
          echo "اندازه‌ی جواب: $(wc -c < body.json 2>/dev/null || echo 0) بایت"
          echo "کلیدهای JSON (بی محتوا):"
          python3 -c "import json;print(sorted(json.load(open('body.json')).keys()))" 2>/dev/null || echo "(JSON نبود یا جواب نیامد)"
          echo "=== help ==="
          CODE2=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$HOST/api/report/$KEY/help" || echo "000")
          echo "HTTP: $CODE2"
          echo "=== کدِ غلط (باید 404) ==="
          CODE3=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$HOST/api/report/WRONGKEY000000000000000000" || echo "000")
          echo "HTTP: $CODE3"
