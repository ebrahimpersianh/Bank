name: دسترسیِ صفحه‌ی «آمارِ جیبک» برای حسابِ خودم

# اجرای دستی. به حسابی با این «شماره‌ی کاربری» (تو برنامه: حسابِ کاربری ← شماره‌ی کاربری)
# اجازه می‌دهد صفحه‌ی «آمارِ جیبک» را در تنظیمات ببیند. فقط شماره‌ی کاربری می‌گیرد نه موبایل،
# چون ورودیِ ورک‌فلو در مخزنِ عمومی برای همه دیده می‌شود.
on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "شماره‌ی کاربری (فقط عدد، مثلاً 1)"
        required: true
      revoke:
        description: "برداشتنِ دسترسی به‌جای دادن"
        type: boolean
        default: false

jobs:
  grant:
    runs-on: ubuntu-latest
    steps:
      - name: ساختِ درخواست
        id: payload
        env:
          USER_ID: ${{ inputs.user_id }}
          REVOKE: ${{ inputs.revoke }}
        run: |
          if ! [[ "$USER_ID" =~ ^[0-9]+$ ]]; then echo "::error::شماره‌ی کاربری باید فقط عدد باشد."; exit 1; fi
          echo "json=$(jq -cn --argjson u "$USER_ID" --argjson r "$REVOKE" '{userId:$u,revoke:$r}')" >> "$GITHUB_OUTPUT"

      - name: فرستادن از طریقِ خودِ سرور
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: PAYLOAD
          script: |
            set -e
            cd ~/VameMan
            TOKEN=$(grep '^ADMIN_TOKEN=' .env | cut -d= -f2-)
            curl -sS -X POST "http://localhost:3000/api/admin/grant" \
              -H "Content-Type: application/json" \
              -H "X-Admin-Token: $TOKEN" \
              -d "$PAYLOAD"
            echo ""
        env:
          PAYLOAD: ${{ steps.payload.outputs.json }}
