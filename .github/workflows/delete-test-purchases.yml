name: حذفِ دو خریدِ آزمایشی (یک‌بار)

# تأییدِ کاربر ۱۳ مهر: ردیف‌های ۱۰ (مایکت) و ۱۱ (کافه‌بازار) آزمایشی‌اند. فقط همین دو id، با کپیِ پشتیبان.
on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            DB=~/VameMan/data.sqlite
            cp $DB ~/VameMan/data.sqlite.before-test-purchase-delete
            echo "=== قبل ==="
            sqlite3 -header $DB "SELECT id, user_id, product_id, store, created_at FROM subscription_purchases WHERE id IN (10, 11);"
            sqlite3 $DB "DELETE FROM subscription_purchases WHERE (id = 10 AND user_id = 29 AND store = 'myket') OR (id = 11 AND user_id = 812 AND store = 'cafebazaar'); SELECT 'deleted: ' || changes();"
            echo "=== بعد ==="
            sqlite3 -header $DB "SELECT id, user_id, store FROM subscription_purchases ORDER BY id DESC LIMIT 3;"
