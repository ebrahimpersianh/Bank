name: Build Native Kotlin App (در حال ساخت - فقط تب وام بانکی)

on:
  push:
    branches: [main, master]
    paths:
      - "native-android/**"
      - ".github/workflows/build-native-android.yml"
  pull_request:
    paths:
      - "native-android/**"
      - ".github/workflows/build-native-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # چون `secrets` مستقیم تو `if:` یه step مجاز نیست، اول یه‌بار تو env سطح job (که این‌جا مجازه)
      # منتقلش می‌کنیم تا استپِ بعدی بتونه با env.HAS_RELEASE_KEY تصمیم بگیره.
      HAS_RELEASE_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: native-android
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: آماده‌سازی Java (لازم برای Gradle/AGP)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: کش Gradle
        uses: gradle/actions/setup-gradle@v4

      # امضای دیباگ حالا مستقیم تو app/build.gradle.kts به فایل کامیت‌شده‌ی ci-debug.keystore پین شده
      # (نه ~/.android/debug.keystore)، پس دیگه نیازی به کپی‌کردن دستیِ کیستور اینجا نیست.

      # کلید واقعیِ release - فقط اگه سکرت‌هاش تو تنظیمات ریپو (Settings → Secrets and variables →
      # Actions) ست شده باشن این استپ فایل کیستور رو از سکرتِ base64 می‌سازه و مسیرش رو به بقیه‌ی
      # استپ‌ها می‌ده (RELEASE_KEYSTORE_PATH تو app/build.gradle.kts خونده می‌شه)؛ وگرنه (سکرت‌ها هنوز
      # ست نشدن) این استپ رد می‌شه و بیلد release طبق فال‌بکِ build.gradle.kts با کلید دیباگ امضا
      # می‌شه - یعنی هیچ‌وقت خودِ بیلد fail نمی‌کنه، فقط تا وقتی سکرت‌ها نیستن نباید اون APK رو رو
      # کافه‌بازار آپلود کرد.
      - name: آماده‌سازی کلید واقعیِ release (اگه سکرت‌هاش ست شده باشن)
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # versionCode یکتا/صعودیه (تا نصبِ بیلدِ جدید رو بیلدِ قبلی downgrade حساب نشه)؛ versionName هم
      # هر بار عوض می‌شه (۱.۰.<شماره‌ی ران>) تا شماره‌ی نسخه‌ای که کاربر تو بازار/مایکت می‌بینه با هر
      # انتشارِ جدید خودکار بروز بشه، بدونِ نیاز به دستی ویرایش‌کردنِ build.gradle.kts هر بار.
      - name: تنظیم versionCode/versionName یکتا و صعودی از شماره‌ی ران
        run: |
          sed -i "s/versionCode = 1/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i "s/versionName = \"1.0\"/versionName = \"1.0.${{ github.run_number }}\"/" app/build.gradle.kts

      - name: تست موتور محاسبه‌ی وام (core - بدون وابستگی به اندروید)
        run: ./gradlew :core:test --console=plain

      # تستِ اسکرین‌شاتِ Compose (Paparazzi، رجوع کن به app/src/test/kotlin/.../ScreenshotTest.kt) -
      # عکسِ واقعیِ رندرشده رو با عکسِ مرجعِ کامیت‌شده (app/src/test/snapshots/) مقایسه می‌کنه؛ اگه
      # فرق داشتن (باگِ ظاهری/تغییرِ عمدیِ طراحی)، این استپ fail می‌شه. عکس‌های مرجع با ورک‌فلوی جداگونه‌ی
      # record-paparazzi-snapshots.yml (اجرای دستی) ساخته/بازسازی می‌شن، نه اینجا.
      # همون دلیلِ ابهامِ تسکِ record تو record-paparazzi-snapshots.yml - چون دو فلیوره، فقط
      # فلیورِ cafebazaar رو تست می‌کنیم (AppCard/LoanCalcTheme به فلیور وابسته نیستن).
      - name: تستِ اسکرین‌شاتِ Compose (Paparazzi)
        run: ./gradlew :app:testCafebazaarDebugUnitTest --console=plain

      # قبلاً بیلدِ دیباگ (هر دو فلیور) هم اینجا ساخته و آپلود می‌شد - به‌خواستِ صریح کاربر حذف شد
      # («من فقط ریلیز رو نصب می‌کنم») چون هم هیچ‌وقت واقعاً استفاده نمی‌شد، هم حجمش تقریباً ۳ برابرِ
      # ریلیز بود و فضای Artifact گیت‌هاب رو زودتر پر می‌کرد (رجوع کن به CLAUDE.md). اگه یه روز واقعاً
      # برای دیباگِ یه کرش خاص لازم شد، همون تسکِ `./gradlew :app:assembleDebug` رو می‌شه دستی/یه‌بار
      # اجرا کرد - نیازی به برگردوندنِ این استپِ خودکار نیست.

      # بیلد release همون کد رو بدون debuggable می‌سازه که خیلی روان‌تره (رفع لگ اسکرول/تعویض تب).
      # امضاش به کلیدِ واقعیِ release (اگه سکرت‌هاش ست شده باشن) یا فال‌بکِ کلید دیباگ بستگی داره -
      # رجوع کن به استپ بالا و کامنتِ signingConfig تو app/build.gradle.kts.
      - name: ساخت APKهای ریلیز (هر دو فلیور - روان، برای نصب این‌ها رو بردار)
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      # retention-days: بدونش پیش‌فرضِ گیت‌هاب ۹۰ روزه - با این‌همه رانِ روزانه، فضای Artifact زودتر
      # از موعد پر می‌شد (خطای «Artifact storage quota has been hit» که چندبار این نشست‌ها دیده شد،
      # رجوع کن به CLAUDE.md). APKِ دیباگ/ریلیز معمولاً همون روز یا فردا نصب/تست می‌شه، نگه‌داشتنِ
      # ۹۰روزه‌ش لازم نیست.
      # continue-on-error: چون سهمیه‌ی Artifact گیت‌هاب گاهی پر می‌شه (مستقل از کدِ ما)، این استپ
      # دیگه کلِ رانو قرمز/fail نشون نمی‌ده - راهِ اصلیِ دانلود از این به بعد استپِ ریلیزِ زیره که
      # اصلاً از این سهمیه استفاده نمی‌کنه.
      - name: بارگذاری APK ریلیز کافه‌بازار (نسخه‌ی روان - این رو نصب کن)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: loan-calculator-native-release-apk
          path: native-android/app/build/outputs/apk/cafebazaar/release/app-cafebazaar-release.apk
          retention-days: 7

      - name: بارگذاری APK ریلیز مایکت
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: loan-calculator-native-myket-release-apk
          path: native-android/app/build/outputs/apk/myket/release/app-myket-release.apk
          retention-days: 7

      # مسیرِ اصلیِ دانلود: به‌جای Artifactِ موقتِ گیت‌هاب (که سهمیه‌ش گاهی پر می‌شه و مستقل از کدِ
      # ما fail می‌کنه)، هر بیلد یه GitHub Release می‌سازه و APKها رو بهش پیوست می‌کنه - Releaseها
      # سهمیه‌ی جدا و بازتری دارن، این مشکل رو ندارن. تگ بر اساسِ شماره‌ی رانه، پس هر بیلد یه ریلیزِ
      # جدا/غیرتکراری می‌سازه.
      - name: انتشارِ APKها به‌عنوانِ GitHub Release (همیشه کار می‌کنه، سهمیه‌ی جدا از Artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            --title "بیلدِ خودکار #${{ github.run_number }}" \
            --notes "نسخه‌ی ۱.۰.${{ github.run_number }} - ساخته‌شده از کامیتِ ${{ github.sha }}" \
            app/build/outputs/apk/cafebazaar/release/app-cafebazaar-release.apk \
            app/build/outputs/apk/myket/release/app-myket-release.apk
