name: Build Native Kotlin App (در حال ساخت - فقط تب وام بانکی)

on:
  push:
    branches: [main, master]
    paths:
      - "native-android/**"
      - ".github/workflows/build-native-android.yml"
  pull_request:
    paths:
      - "native-android/**"
      - ".github/workflows/build-native-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-android
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: آماده‌سازی Java (لازم برای Gradle/AGP)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: کش Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: تست موتور محاسبه‌ی وام (core - بدون وابستگی به اندروید)
        run: ./gradlew :core:test --console=plain

      - name: ساخت APK دیباگ
        run: ./gradlew :app:assembleDebug --console=plain

      - name: بارگذاری APK به‌عنوان خروجی قابل دانلود
        uses: actions/upload-artifact@v4
        with:
          name: loan-calculator-native-debug-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
