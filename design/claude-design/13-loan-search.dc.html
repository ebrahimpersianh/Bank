<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0">
<style>body{margin:0;background:#E9EEEB;font-family:Vazirmatn,sans-serif}a{color:#15803D}a:hover{color:#0E7A35}</style>
</helmet>
<div dir="rtl" style="display:flex;flex-wrap:wrap;gap:40px;padding:48px;align-items:flex-start;font-family:Vazirmatn,sans-serif;color:#14201A;">
  <sc-for list="{{ frames }}" as="f" hint-placeholder-count="2">
    <div id="{{ f.id }}" style="display:flex;flex-direction:column;gap:12px;">
      <div style="font-size:13px;font-weight:700;color:#5B6B62;">{{ f.label }}</div>
      <div style="width:360px;min-height:780px;background:#F4F8F6;border-radius:36px;border:1.5px solid #D5DED8;box-shadow:0 6px 0 #D5DED8;overflow:hidden;display:flex;flex-direction:column;">
        <div style="padding:26px 16px 8px;display:flex;flex-direction:column;gap:14px;">
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="font-family:'Material Symbols Rounded';font-size:26px;">arrow_forward</span>
            <div style="font-size:21px;font-weight:900;flex:1;">وام</div>
            <div style="width:44px;height:44px;border-radius:14px;background:#E8F5EC;border:1.5px solid #9FD3B2;color:#15803D;display:flex;align-items:center;justify-content:center;"><span style="font-family:'Material Symbols Rounded';font-size:22px;">search</span></div>
          </div>
          <div style="display:flex;background:#E6EDE8;border-radius:999px;padding:4px;">
            <div style="flex:1;height:40px;border-radius:999px;background:#16A34A;box-shadow:0 3px 0 #0E7A35;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;">وام‌های من</div>
            <div style="flex:1;height:40px;color:#5B6B62;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;">سپرده</div>
            <div style="flex:1;height:40px;color:#5B6B62;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;">محاسبه‌گر</div>
          </div>
          <dc-import name="LoanHero" mode="ratio" hint-size="100%,300px"></dc-import>
          <div style="{{ f.searchStyle }}"><span style="font-family:'Material Symbols Rounded';font-size:22px;color:#7A8A81;">search</span><div style="{{ f.qStyle }}">{{ f.q }}</div></div>
          <div style="display:flex;gap:6px;align-items:center;">
            <div style="height:36px;padding:0 10px;border-radius:999px;background:#fff;border:1.5px solid #E3EBE6;font-size:12px;font-weight:700;display:flex;align-items:center;white-space:nowrap;">همه (۱۴)</div>
            <div style="height:36px;padding:0 10px;border-radius:999px;background:#16A34A;box-shadow:0 3px 0 #0E7A35;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;white-space:nowrap;">{{ f.active }}</div>
            <div style="height:36px;padding:0 10px;border-radius:999px;background:#fff;border:1.5px solid #E3EBE6;font-size:12px;font-weight:700;display:flex;align-items:center;white-space:nowrap;">تسویه‌شده (۴)</div>
            <div style="margin-right:auto;display:flex;align-items:center;gap:2px;color:#15803D;font-size:12.5px;font-weight:800;"><span style="font-family:'Material Symbols Rounded';font-size:20px;">filter_list</span>فیلتر</div>
          </div>
          <sc-for list="{{ f.loans }}" as="l" hint-placeholder-count="2">
            <div style="background:#fff;border:1.5px solid #F5C6C6;border-radius:24px;box-shadow:0 3px 0 #F5C6C6;padding:14px;display:flex;flex-direction:column;gap:10px;">
              <div style="display:flex;align-items:center;gap:8px;">
                <div style="font-size:15.5px;font-weight:900;">{{ l.name }}</div>
                <div style="background:#FDEEEE;color:#C53030;font-size:11px;font-weight:900;padding:2px 9px;border-radius:999px;">معوق</div>
                <div style="{{ l.ring }}"><div style="width:36px;height:36px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:900;color:#C53030;">{{ l.pct }}</div></div>
              </div>
              <div style="font-size:13px;font-weight:800;color:#C53030;">عقب‌افتاده · {{ l.late }} تومان</div>
              <div style="display:flex;align-items:center;gap:10px;">
                <div style="flex:1;display:flex;gap:12px;font-size:11.5px;color:#7A8A81;flex-wrap:wrap;">
                  <span style="display:flex;align-items:center;gap:3px;"><span style="font-family:'Material Symbols Rounded';font-size:15px;">event_note</span>{{ l.count }}</span>
                  <span style="display:flex;align-items:center;gap:3px;"><span style="font-family:'Material Symbols Rounded';font-size:15px;">account_balance</span>{{ l.bank }}</span>
                </div>
                <div style="height:38px;padding:0 18px;border-radius:999px;background:#16A34A;box-shadow:0 3px 0 #0E7A35;color:#fff;font-weight:800;font-size:13.5px;display:flex;align-items:center;">پرداخت</div>
              </div>
            </div>
          </sc-for>
        </div>
        <div style="margin-top:auto;"><dc-import name="JibakNav" active="loan" hint-size="100%,90px"></dc-import></div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ring = p => ({marginRight:'auto',width:'46px',height:'46px',borderRadius:'999px',display:'flex',alignItems:'center',justifyContent:'center',background:`conic-gradient(#E53E3E 0 ${p}%, #FBE0E0 ${p}% 100%)`});
    const base = {display:'flex',alignItems:'center',gap:'10px',height:'50px',borderRadius:'16px',background:'#fff',padding:'0 14px'};
    return { frames: [
      { id:'13a', label:'13a · وام — جست‌وجو بسته', q:'جستجو تو وام‌ها (اسم/بانک)...', qStyle:{fontSize:'13.5px',color:'#9AA8A0'}, searchStyle:{...base,border:'1.5px solid #D5DED8'}, active:'فعال (۱۰) · ۹ عقب',
        loans:[{name:'وام ۱۹/۸',late:'۱٬۸۷۶٬۵۴۵',count:'۲ از ۱۲ قسط',bank:'بانک ملی ایران',pct:'۱۷٪',ring:ring(17)},{name:'وام 95 میلیونی',late:'۶٬۲۷۵٬۸۰۷',count:'۶ از ۱۸ قسط',bank:'بانک ملی ایران',pct:'۳۳٪',ring:ring(33)}] },
      { id:'13b', label:'13b · در حالِ تایپ', q:'ازد', qStyle:{fontSize:'15px',color:'#14201A',fontWeight:700}, searchStyle:{...base,border:'2px solid #16A34A',boxShadow:'0 3px 0 #BFE3CB'}, active:'فعال (۱۰) · ۲ عقب',
        loans:[{name:'وام ازدواج صادق',late:'۲٬۷۲۷٬۲۷۲',count:'۱۳ از ۱۲۰ قسط',bank:'بانک رفاه کارگران',pct:'۱۱٪',ring:ring(11)},{name:'وام ازدواج مبینا',late:'۲٬۷۲۷٬۲۷۲',count:'۱۳ از ۱۲۰ قسط',bank:'بانک رفاه کارگران',pct:'۱۱٪',ring:ring(11)}] }
    ] };
  }
}
</script>
</body>
</html>
