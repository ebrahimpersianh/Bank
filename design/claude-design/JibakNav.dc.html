<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="margin-top:auto;padding:10px 12px 14px;background:transparent;">
  <div style="display:flex;flex-direction:row;direction:rtl;background:#fff;border:1.5px solid #E3EBE6;border-radius:28px;box-shadow:0 3px 0 #E3EBE6;padding:6px;gap:2px;">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
      <div style="{{ it.style }}">
        <span style="font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-variation-settings:'FILL' 1;">{{ it.icon }}</span>
        <span style="font-size:12px;font-weight:700;">{{ it.label }}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;home&quot;,&quot;asset&quot;,&quot;report&quot;,&quot;budget&quot;,&quot;loan&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || '';
    const base = 'flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:22px;';
    const defs = [['home','خانه','home'],['asset','دارایی','account_balance_wallet'],['report','گزارش','bar_chart'],['budget','بودجه','savings'],['loan','وام','payments']];
    const toObj = s => Object.fromEntries(s.split(';').filter(Boolean).map(p => { const i = p.indexOf(':'); return [p.slice(0,i).replace(/-([a-z])/g,(m,c)=>c.toUpperCase()), p.slice(i+1)]; }));
    return { items: defs.map(([k,l,i]) => ({ label:l, icon:i, style: toObj(base + (k===a ? 'background:#E8F5EC;color:#15803D;' : 'color:#7A8A81;')) })) };
  }
}
</script>
</body>
</html>
