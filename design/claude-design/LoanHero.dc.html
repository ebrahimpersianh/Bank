<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div dir="rtl" style="background:linear-gradient(160deg,#1DB257,#128A3E);border-radius:26px;box-shadow:0 4px 0 #0E7A35;padding:16px;color:#fff;display:flex;flex-direction:column;gap:12px;font-family:Vazirmatn,sans-serif;">
  <div style="display:flex;gap:10px;align-items:flex-start;">
    <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;"><div style="font-size:13px;opacity:.92;">قسطِ این ماه</div><div style="background:#fff;color:#C53030;font-size:11px;font-weight:900;padding:2px 9px;border-radius:999px;">۲۰ قسطِ معوق</div></div>
      <div style="font-size:24px;font-weight:900;white-space:nowrap;">۳۸٬۱۸۸٬۶۳۶ <span style="font-size:14px;font-weight:700;">تومان</span></div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="width:66px;height:66px;border-radius:999px;background:conic-gradient(#fff 0 33%,rgba(255,255,255,.25) 33% 100%);display:flex;align-items:center;justify-content:center;"><div style="width:52px;height:52px;border-radius:999px;background:#17964A;display:flex;flex-direction:column;align-items:center;justify-content:center;"><div style="font-size:15px;font-weight:900;line-height:1.1;">۳۳٪</div><div style="font-size:8px;opacity:.9;white-space:nowrap;">از ۴۹۸ قسط</div></div></div>
      <div style="background:rgba(255,255,255,.2);font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;display:flex;align-items:center;gap:2px;white-space:nowrap;"><span style="font-family:'Material Symbols Rounded';font-size:13px;">check</span>۱۶۸ پرداخت شده</div>
    </div>
  </div>
  <sc-if value="{{ isRatio }}" hint-placeholder-val="{{ true }}">
    <div style="align-self:stretch;justify-content:center;white-space:nowrap;background:#fff;color:#14201A;font-size:12px;font-weight:800;padding:7px 12px;border-radius:999px;display:flex;align-items:center;gap:4px;box-shadow:0 2px 0 #0E7A35;"><span style="color:#C53030;">۱۰۹٪</span> از درآمدت صرفِ اقساط می‌شه<span style="font-family:'Material Symbols Rounded';font-size:16px;">chevron_left</span></div>
  </sc-if>
  <sc-if value="{{ isIncome }}" hint-placeholder-val="{{ false }}">
    <div style="align-self:flex-start;background:rgba(255,255,255,.2);border:1.5px dashed rgba(255,255,255,.7);font-size:12.5px;font-weight:800;padding:6px 12px;border-radius:999px;display:flex;align-items:center;gap:4px;">درآمدِ ماهانه‌ات را ثبت کن<span style="font-family:'Material Symbols Rounded';font-size:16px;">chevron_left</span></div>
  </sc-if>
  <div style="position:relative;height:36px;">
    <svg width="100%" height="36" viewBox="0 0 300 36" preserveAspectRatio="none" style="display:block;"><polyline points="0,6 60,10 120,15 180,20 240,25 300,30" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2.5" stroke-linecap="round"></polyline></svg>
    <div style="position:absolute;right:-2px;top:0;width:10px;height:10px;border-radius:999px;background:#fff;"></div>
    <div style="position:absolute;right:-6px;top:14px;font-size:10px;font-weight:800;background:rgba(255,255,255,.2);padding:1px 6px;border-radius:999px;">مهر</div>
  </div>
  <div style="display:grid;grid-template-columns:1.25fr .8fr 1fr;gap:6px;background:rgba(0,0,0,.12);border-radius:16px;padding:10px;">
    <div><div style="font-size:10.5px;opacity:.85;">ماندهٔ کل</div><div style="font-size:13px;font-weight:900;white-space:nowrap;">۱٬۱۳۲٬۲۵۵٬۵۴۵</div></div>
    <div><div style="font-size:10.5px;opacity:.85;">تا آزادی</div><div style="font-size:13px;font-weight:900;">۱۰۷ ماه</div></div>
    <div><div style="font-size:10.5px;color:#FFD9D9;font-weight:700;">معوق</div><div style="font-size:13px;font-weight:900;">۷۹٬۵۶۴٬۲۷۲</div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:330,&quot;height&quot;:300},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ratio&quot;,&quot;income&quot;],&quot;default&quot;:&quot;ratio&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() { const m = this.props.mode || 'ratio'; return { isRatio: m === 'ratio', isIncome: m === 'income' }; }
}
</script>
</body>
</html>
