<!doctype html><html dir="rtl" lang="fa"><head><meta charset="utf-8"><style>
@font-face{font-family:V;src:url('file:///home/user/Bank/native-android/app/src/main/res/font/vazirmatn_bold.ttf');font-weight:800}
@font-face{font-family:V;src:url('file:///home/user/Bank/native-android/app/src/main/res/font/vazirmatn_regular.ttf');font-weight:400}
body{margin:0;background:#121921;font-family:V;color:#eef2f5;width:400px;padding:16px;box-sizing:border-box}
.sec{border-radius:22px;padding:10px;margin-bottom:10px}
.b{background:rgba(20,163,160,.09);border:1.5px solid rgba(20,163,160,.38)}
.p{background:rgba(165,110,255,.09);border:1.5px solid rgba(165,110,255,.38)}
.hd{display:flex;align-items:center;gap:10px;padding:4px}
.hi{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px}
.ht{flex:1}.ht b{font-size:14.5px}.ht div{color:#8f9aa4;font-size:10px}
.cnt{border-radius:99px;padding:4px 11px;font-size:11px;font-weight:800;background:#252e38}
.card{display:flex;gap:10px;border-radius:18px;padding:10px 12px;margin-top:8px;background:#1a222b;border:1px solid #2a343e}
.dep{background:linear-gradient(rgba(46,204,113,.05),rgba(46,204,113,.05)),#1a222b;border-color:rgba(46,204,113,.16)}
.wd{background:linear-gradient(rgba(229,72,77,.05),rgba(229,72,77,.05)),#1a222b;border-color:rgba(229,72,77,.16)}
.ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.card b{font-size:13px}.card div div{color:#97a2ac;font-size:11px;margin-top:2px}
</style></head><body>
<div class="sec b"><div class="hd"><div class="hi" style="background:#1d3a3c">👤</div><div class="ht"><b>پیام‌های شما</b><div>تراکنش‌ها، پرداخت‌ها، یادآوری‌ها</div></div><div class="cnt">۲۲ مورد</div></div>
<div class="card dep"><div class="ic" style="background:rgba(46,204,113,.14);color:#2ecc71">+</div><div><b>واریزِ تازه</b><div>۲۰۰٬۰۰۰ تومان از «بلو بانک»</div></div></div>
<div class="card wd"><div class="ic" style="background:rgba(229,72,77,.16);color:#e5484d">−</div><div><b>برداشت</b><div>۸۵٬۰۰۰ تومان از «بلو بانک»</div></div></div></div>
<div class="sec p"><div class="hd"><div class="hi" style="background:#a56eff">📣</div><div class="ht"><b>پیام‌های جیبک</b><div>خبرها و قابلیت‌های جدید</div></div><div class="cnt" style="color:#a56eff;background:rgba(165,110,255,.14)">۳ مورد</div></div>
<div class="card"><div class="ic" style="background:rgba(165,110,255,.14);color:#a56eff">✦</div><div><b>قابلیتِ تازه: دنگ</b><div>۱۸ مهر</div></div></div></div>
</body></html>
