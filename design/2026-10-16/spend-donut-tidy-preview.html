<!doctype html><html dir="rtl" lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خرجِ این ماه</title>
<style>
body{margin:0;background:#0F1720;font-family:Vazirmatn,Tahoma,sans-serif;color:#E6EDF3;padding:16px}
h3{font-size:13px;color:#8A97A6;margin:22px 4px 8px;font-weight:700}
.card{background:#1A2430;border:1px solid #26333F;border-radius:22px;padding:16px}
.head{display:flex;align-items:center;margin-bottom:14px}
.head b{flex:1;font-size:14px}.head span{color:#5FD3C6;font-size:11px;font-weight:800}
.top{display:flex;align-items:center;gap:16px}
.donut{position:relative;width:80px;height:80px;flex:none}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.donut .c b{font-size:17px}.donut .c i{font-style:normal;font-size:10px;color:#8A97A6}
.sum small{display:block;font-size:11px;color:#8A97A6;margin-bottom:2px}
.sum b{font-size:22px;font-weight:900}.sum u{text-decoration:none;font-size:12px;color:#8A97A6;margin-inline-start:5px;font-weight:700}
.list{margin-top:14px;border-top:1px solid #26333F}
.r{display:flex;align-items:center;padding:10px 2px;border-bottom:1px solid #202C38;font-size:13px}
.r:last-child{border-bottom:0;padding-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;margin-inline-end:9px;flex:none}
.r .n{flex:1;font-weight:700}
.r .m{font-weight:800;font-size:12.5px}
.r .p{width:44px;text-align:left;color:#8A97A6;font-size:12px;font-weight:700}
.more{font-size:11px;color:#8A97A6;padding-top:8px}
</style></head><body>

<h3>طرحِ مرتب‌تر — حالتِ فعلیِ تو (فقط یک دسته)</h3>
<div class="card">
 <div class="head"><b>خرجِ این ماه</b><span>جزئیاتِ بیشتر ‹</span></div>
 <div class="top">
  <div class="donut">
   <svg width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="#26333F" stroke-width="9"/>
    <circle cx="40" cy="40" r="34" fill="none" stroke="#FF6B6B" stroke-width="9" stroke-linecap="round" stroke-dasharray="211 214" transform="rotate(-90 40 40)"/></svg>
   <div class="c"><b>۱</b><i>دسته</i></div>
  </div>
  <div class="sum"><small>جمعِ خرجِ این ماه</small><b>۳٫۳</b><u>میلیون تومان</u></div>
 </div>
 <div class="list">
  <div class="r"><span class="dot" style="background:#FF6B6B"></span><span class="n">قسط/چک</span><span class="m">۳٫۳ میلیون</span><span class="p">۹۹٪</span></div>
 </div>
</div>

<h3>همان طرح وقتی دسته‌ها چندتا شدند</h3>
<div class="card">
 <div class="head"><b>خرجِ این ماه</b><span>جزئیاتِ بیشتر ‹</span></div>
 <div class="top">
  <div class="donut">
   <svg width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="#26333F" stroke-width="9"/>
    <circle cx="40" cy="40" r="34" fill="none" stroke="#FF6B6B" stroke-width="9" stroke-dasharray="106 214" transform="rotate(-90 40 40)"/>
    <circle cx="40" cy="40" r="34" fill="none" stroke="#9B7BFF" stroke-width="9" stroke-dasharray="64 214" stroke-dashoffset="-108" transform="rotate(-90 40 40)"/>
    <circle cx="40" cy="40" r="34" fill="none" stroke="#4DA3FF" stroke-width="9" stroke-dasharray="40 214" stroke-dashoffset="-174" transform="rotate(-90 40 40)"/></svg>
   <div class="c"><b>۳</b><i>دسته</i></div>
  </div>
  <div class="sum"><small>جمعِ خرجِ این ماه</small><b>۳٫۳</b><u>میلیون تومان</u></div>
 </div>
 <div class="list">
  <div class="r"><span class="dot" style="background:#FF6B6B"></span><span class="n">قسط/چک</span><span class="m">۱٫۶ میلیون</span><span class="p">۵۰٪</span></div>
  <div class="r"><span class="dot" style="background:#9B7BFF"></span><span class="n">خوراک</span><span class="m">۹۸۰ هزار</span><span class="p">۳۰٪</span></div>
  <div class="r"><span class="dot" style="background:#4DA3FF"></span><span class="n">حمل‌ونقل</span><span class="m">۷۲۰ هزار</span><span class="p">۲۰٪</span></div>
 </div>
</div>
</body></html>
