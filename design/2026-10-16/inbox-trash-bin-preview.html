<!doctype html><html dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سطل زباله</title>
<style>
body{margin:0;background:#0F1720;font-family:Vazirmatn,Tahoma,sans-serif;color:#E6EDF3;padding:16px}
h3{font-size:14px;color:#8A97A6;margin:22px 4px 8px}
.row{display:flex;align-items:center;gap:12px;background:#1A2430;border-radius:18px;padding:12px 14px}
.box{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.t{flex:1}.t b{display:block;font-size:15px}.t span{font-size:12px;color:#8A97A6}
.badge{background:#E5484D;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px;margin-inline-start:6px}
.chev{color:#5FD3C6;font-size:18px}
@keyframes wig{0%,78%,100%{transform:rotate(0)}82%{transform:rotate(-8deg)}86%{transform:rotate(7deg)}90%{transform:rotate(-4deg)}94%{transform:rotate(2deg)}}
.wig{animation:wig 2.6s infinite;transform-origin:50% 90%}
</style></head><body>
<h3>خالی — درِ سطل کمی باز، کم‌رنگ</h3>
<div class="row">
 <div class="box" style="background:#22303D">
  <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
   <g transform="rotate(-22 19 6)"><rect x="4" y="5" width="16" height="2.2" rx="1.1" fill="#8A97A6"/><rect x="9.5" y="3" width="5" height="2.4" rx="1" fill="#8A97A6"/></g>
   <path d="M6 9h12l-1.1 10.4a2 2 0 0 1-2 1.6H9.1a2 2 0 0 1-2-1.6L6 9z" fill="#8A97A6" opacity=".25" stroke="#8A97A6" stroke-width="1.4"/>
   <path d="M10 12v6M14 12v6" stroke="#8A97A6" stroke-width="1.4" stroke-linecap="round"/>
  </svg></div>
 <div class="t"><b>سطلِ زباله</b><span>خالی است · ردشده‌ها ۳۰ روز این‌جا می‌مانند</span></div>
</div>

<h3>پر — کاغذ پیداست، تکانِ ریز هر چند ثانیه، شمارنده‌ی قرمز</h3>
<div class="row">
 <div class="box" style="background:#123A3A">
  <svg class="wig" width="30" height="30" viewBox="0 0 24 24" fill="none">
   <circle cx="10" cy="7.6" r="2.4" fill="#F2F5F7"/><circle cx="14.2" cy="7.2" r="2" fill="#CFE9E6"/>
   <g transform="rotate(-8 19 5)"><rect x="4" y="4.2" width="16" height="2.2" rx="1.1" fill="#2BB3A3"/><rect x="9.5" y="2.2" width="5" height="2.4" rx="1" fill="#2BB3A3"/></g>
   <path d="M6 9h12l-1.1 10.4a2 2 0 0 1-2 1.6H9.1a2 2 0 0 1-2-1.6L6 9z" fill="#2BB3A3"/>
   <path d="M10 12v6M14 12v6" stroke="#0F2A2A" stroke-width="1.4" stroke-linecap="round"/>
  </svg></div>
 <div class="t"><b>سطلِ زباله<span class="badge">۱</span></b><span>۱ تراکنشِ ردشده · بزن تا ببینی</span></div>
 <div class="chev">‹</div>
</div>
</body></html>
